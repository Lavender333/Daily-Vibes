name: Update Her profile voice

on:
  push:
    paths:
      - '.github/workflows/update-her-voice.yml'

permissions:
  contents: write

jobs:
  update-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply second-person voice to Her profile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'noteF: "Amplify day — her Aries Venus favors warmth and direct expression"':
                  'noteF: "Amplify day — your Aries Venus favors warmth and direct expression"',
              'F: { name: "Her", born: "February 11, 1988 · 5:22 a.m. · West Palm Beach, Florida"':
                  'F: { name: "You", born: "February 11, 1988 · 5:22 a.m. · West Palm Beach, Florida"',
              'F: { label: "Her · Feb 11", sub: "Aquarius Sun · Scorpio Moon · Cap Rising"':
                  'F: { label: "You · Feb 11", sub: "Aquarius Sun · Scorpio Moon · Cap Rising"',
          }

          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit('Expected text was not found; refusing unsafe edit:\n' + '\n'.join(missing))

          for old, new in replacements.items():
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit update
        shell: bash
        run: |
          rm .github/workflows/update-her-voice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-her-voice.yml
          git commit -m "Use second-person voice for Her profile"
          git push
