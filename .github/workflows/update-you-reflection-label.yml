name: Update You reflection label

on:
  push:
    paths:
      - '.github/workflows/update-you-reflection-label.yml'

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Her reflection heading to You
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'profile === "M" ? "How He May Be Feeling Today" : profile === "F" ? "How She May Be Feeling Today" : "What Your Child May Need Today"'
          new = 'profile === "M" ? "How He May Be Feeling Today" : profile === "F" ? "How You May Be Feeling Today" : "What Your Child May Need Today"'

          if old not in text:
              raise SystemExit('Expected reflection heading was not found; refusing unsafe edit.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit update
        shell: bash
        run: |
          rm .github/workflows/update-you-reflection-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-you-reflection-label.yml
          git commit -m "Use second-person reflection heading"
          git push
