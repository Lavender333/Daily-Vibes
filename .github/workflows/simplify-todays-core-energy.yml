name: Update You profile insight wording
on:
  push:
    paths:
      - '.github/workflows/simplify-todays-core-energy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update insight labels and second-person copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = {
            '{ label: "Feeling",    icon: "💭", text: cur.insight.feeling },':
            '{ label: profile === "F" ? "What You May Be Feeling" : "Feeling", icon: "💭", text: profile === "F" ? insightToSecondPerson(cur.insight.feeling) : cur.insight.feeling },',

            '{ label: "May Benefit From", icon: "🌱", text: softenNeedLanguage(cur.insight.needs) },':
            '{ label: profile === "F" ? "What Will Support You Today" : "May Benefit From", icon: "🌱", text: profile === "F" ? softenNeedLanguage(insightToSecondPerson(cur.insight.needs)) : softenNeedLanguage(cur.insight.needs) },',

            '{ label: "Watch For",  icon: "👁",  text: cur.insight.watchFor },':
            '{ label: profile === "F" ? "Be Mindful Of" : "Watch For", icon: "👁", text: profile === "F" ? insightToSecondPerson(cur.insight.watchFor) : cur.insight.watchFor },',
          }

          changed = False
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new, 1)
              changed = True

          s = s.replace('Her Personal Energy', 'Your Personal Energy')
          s = s.replace('HER PERSONAL ENERGY', 'YOUR PERSONAL ENERGY')
          s = s.replace('Deeper Reading for Her', 'Your Deeper Reading')

          p.write_text(s)
          print('updated' if changed else 'already updated')
          PY
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No app changes needed"
            exit 0
          fi
          git commit -m "Use second-person insight labels for You profile"
          git pull --rebase origin main
          git push origin HEAD:main
