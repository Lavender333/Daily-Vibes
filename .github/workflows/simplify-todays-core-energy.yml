name: Update You profile wording
on:
  push:
    paths:
      - '.github/workflows/simplify-todays-core-energy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace remaining Her labels
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = {
            'Her Personal Energy': 'Your Personal Energy',
            'HER PERSONAL ENERGY': 'YOUR PERSONAL ENERGY',
            'Deeper Reading for Her': 'Your Deeper Reading',
            'DEEPER READING FOR HER': 'YOUR DEEPER READING',
            'on her Feb 11 birthday': 'on your Feb 11 birthday',
            'for her — kept separate': 'for you — kept separate',
            'Her personal chart-specific': 'Your personal chart-specific',
          }

          for old, new in replacements.items():
            s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No app changes needed"
            exit 0
          fi
          git commit -m "Use You wording throughout profile"
          git pull --rebase origin main
          git push origin HEAD:main
